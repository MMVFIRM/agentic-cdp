services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: acdp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: acdp
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acdp"]
      interval: 5s
      retries: 10
  api:
    build: { context: .., dockerfile: deploy/Dockerfile }
    depends_on: { db: { condition: service_healthy } }
    env_file: ../.env
    environment:
      ACDP_DATABASE_URL: postgresql+psycopg://acdp:${POSTGRES_PASSWORD}@db:5432/acdp
    ports: ["8080:8080"]
volumes:
  pgdata: {}
