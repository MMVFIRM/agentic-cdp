[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-cdp"
version = "0.1.0"
description = "Agentic Customer Data Platform: AI-proposed, deterministically-gated identity resolution with a hash-chained audit ledger."
requires-python = ">=3.10"
license = { text = "Proprietary - MMV Firm (Memento Mori Vivere LLC)" }
dependencies = [
  "fastapi>=0.110",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "pydantic>=2.5",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
test = ["pytest>=8"]

[project.scripts]
acdp = "acdp.cli:main"

[tool.setuptools.packages.find]
include = ["acdp*"]

[tool.setuptools.package-data]
acdp = ["console/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
